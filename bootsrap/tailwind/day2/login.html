<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Registration Portal | TechNova Learning Hub</title>
  <meta name="description" content="Sign in or register for TechNova Learning Hub using your verified Email address and Phone Number.">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between antialiased selection:bg-cyan-500 selection:text-white">

  <!-- Ambient Blobs -->
  <div class="fixed top-1/4 left-1/3 w-96 h-96 bg-blob-blue rounded-full filter blur-3xl pointer-events-none -z-10 animate-pulse"></div>

  <!-- Minimal Header -->
  <header class="p-6 border-b border-slate-800/80 bg-slate-900/40">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-cyan-400 flex items-center justify-center text-white text-lg font-bold">
          <i class="fa-solid fa-cube"></i>
        </div>
        <span class="text-xl font-extrabold font-display text-white">TechNova Hub</span>
      </a>
      <a href="index.html" class="text-xs font-semibold text-slate-400 hover:text-white flex items-center gap-1.5">
        <i class="fa-solid fa-arrow-left"></i> Back to Home
      </a>
    </div>
  </header>

  <!-- Auth Center Container -->
  <main class="flex-1 flex items-center justify-center p-4 sm:p-6 my-8">
    <div class="w-full max-w-md bg-slate-900/90 backdrop-blur-xl border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl">
      
      <!-- Portal Brand Header -->
      <div class="text-center mb-6">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-blue-600 to-cyan-400 flex items-center justify-center text-xl text-white mx-auto mb-3 shadow-lg shadow-cyan-500/20">
          <i class="fa-solid fa-user-shield"></i>
        </div>
        <h1 class="text-2xl font-black text-white font-display">Student Portal</h1>
        <p class="text-xs text-slate-400 mt-1">Access your Full-Stack & AI Learning Hub</p>
      </div>

      <!-- 1-Click Demo Accounts Banner -->
      <div class="mb-6 p-4 rounded-2xl bg-slate-800/70 border border-slate-700/80">
        <span class="block text-[11px] font-bold text-cyan-400 uppercase tracking-wider mb-2">⚡ 1-Click Fast Login</span>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
          <button type="button" onclick="loginDemo(0)" class="p-2.5 rounded-xl bg-slate-700 hover:bg-slate-600 text-xs font-semibold text-slate-200 text-left flex items-center gap-2 transition-all">
            <i class="fa-solid fa-code text-cyan-400"></i>
            <div>
              <p class="font-bold text-white leading-none">Alex Chen</p>
              <p class="text-[10px] text-slate-400">Full-Stack Track</p>
            </div>
          </button>
          <button type="button" onclick="loginDemo(1)" class="p-2.5 rounded-xl bg-slate-700 hover:bg-slate-600 text-xs font-semibold text-slate-200 text-left flex items-center gap-2 transition-all">
            <i class="fa-solid fa-brain text-purple-400"></i>
            <div>
              <p class="font-bold text-white leading-none">Priya Patel</p>
              <p class="text-[10px] text-slate-400">AI Specialist</p>
            </div>
          </button>
        </div>
      </div>

      <!-- Tab Switcher -->
      <div class="flex border-b border-slate-800 mb-6">
        <button id="auth-tab-login" onclick="switchTab('login')" class="flex-1 pb-3 font-semibold text-sm transition-colors text-cyan-400 border-b-2 border-cyan-400">
          Sign In
        </button>
        <button id="auth-tab-register" onclick="switchTab('register')" class="flex-1 pb-3 font-semibold text-sm transition-colors text-slate-400">
          Create Account
        </button>
      </div>

      <!-- LOGIN FORM -->
      <form id="page-login-form" onsubmit="event.preventDefault(); handlePageLogin();" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">Email Address or Phone Number</label>
          <div class="relative">
            <i class="fa-solid fa-user absolute left-3.5 top-3.5 text-slate-500 text-sm"></i>
            <input id="login-identifier" type="text" placeholder="alex.chen@technova.dev or +1 555-0199" required class="w-full pl-10 pr-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-400">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">Password</label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-slate-500 text-sm"></i>
            <input id="login-password" type="password" placeholder="••••••••" required class="w-full pl-10 pr-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-400">
          </div>
        </div>

        <button type="submit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-blue-600 via-indigo-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white font-bold text-sm shadow-xl shadow-cyan-500/20 transition-all">
          Sign In with Email / Phone
        </button>
      </form>

      <!-- REGISTER FORM (Email & Phone Required) -->
      <form id="page-register-form" onsubmit="event.preventDefault(); handlePageRegister();" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">Full Name</label>
          <div class="relative">
            <i class="fa-solid fa-user-tag absolute left-3.5 top-3.5 text-slate-500 text-sm"></i>
            <input id="reg-name" type="text" placeholder="e.g. David Sterling" required class="w-full pl-10 pr-4 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-sm text-white focus:outline-none focus:border-cyan-400">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">Email Address</label>
          <div class="relative">
            <i class="fa-solid fa-envelope absolute left-3.5 top-3.5 text-slate-500 text-sm"></i>
            <input id="reg-email" type="email" placeholder="david@example.com" required class="w-full pl-10 pr-4 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-sm text-white focus:outline-none focus:border-cyan-400">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">Phone Number (with Country Code)</label>
          <div class="relative">
            <i class="fa-solid fa-phone absolute left-3.5 top-3.5 text-slate-500 text-sm"></i>
            <input id="reg-phone" type="tel" placeholder="+1 555-0199 or +91 9876543210" required class="w-full pl-10 pr-4 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-sm text-white focus:outline-none focus:border-cyan-400">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">Password</label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-slate-500 text-sm"></i>
            <input id="reg-pass" type="password" placeholder="Minimum 6 characters" required class="w-full pl-10 pr-4 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-sm text-white focus:outline-none focus:border-cyan-400">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">Primary Department Track</label>
          <select id="reg-track" class="w-full px-3.5 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-sm text-white focus:outline-none focus:border-cyan-400">
            <option value="Full-Stack Developer">Full-Stack Web Development</option>
            <option value="AI & ML Specialist">AI, LLMs & Generative AI</option>
            <option value="Python Backend Engineer">Python Backend & FastAPI</option>
            <option value="Java Enterprise Architect">Enterprise Java & Spring Boot</option>
          </select>
        </div>

        <button type="submit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-blue-600 via-indigo-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white font-bold text-sm shadow-xl shadow-cyan-500/20 transition-all">
          Create TechNova Account
        </button>
      </form>

      <p class="text-[11px] text-slate-500 text-center mt-6">
        By continuing, you agree to TechNova Learning Hub's Terms of Service and Privacy Policy.
      </p>

    </div>
  </main>

  <!-- Footer -->
  <footer class="p-4 border-t border-slate-800 text-center text-xs text-slate-500">
    &copy; 2026 TechNova Learning Hub. Authenticated Email & Phone Security Portal.
  </footer>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script>
    function switchTab(tab) {
      const loginTab = document.getElementById("auth-tab-login");
      const regTab = document.getElementById("auth-tab-register");
      const loginForm = document.getElementById("page-login-form");
      const regForm = document.getElementById("page-register-form");

      if (tab === "login") {
        loginTab.className = "flex-1 pb-3 font-semibold text-sm transition-colors text-cyan-400 border-b-2 border-cyan-400";
        regTab.className = "flex-1 pb-3 font-semibold text-sm transition-colors text-slate-400";
        loginForm.classList.remove("hidden");
        regForm.classList.add("hidden");
      } else {
        regTab.className = "flex-1 pb-3 font-semibold text-sm transition-colors text-cyan-400 border-b-2 border-cyan-400";
        loginTab.className = "flex-1 pb-3 font-semibold text-sm transition-colors text-slate-400";
        regForm.classList.remove("hidden");
        loginForm.classList.add("hidden");
      }
    }

    function loginDemo(idx) {
      TechNovaAuth.loginAsDemo(idx);
      TechNovaMain.showToast("Logged in successfully!", "success");
      redirectToTarget();
    }

    function handlePageLogin() {
      const ident = document.getElementById("login-identifier").value;
      const pass = document.getElementById("login-password").value;
      const res = TechNovaAuth.login(ident, pass);
      if (res.success) {
        TechNovaMain.showToast(`Welcome back, ${res.user.name}!`, "success");
        redirectToTarget();
      } else {
        TechNovaMain.showToast(res.message, "error");
      }
    }

    function handlePageRegister() {
      const name = document.getElementById("reg-name").value;
      const email = document.getElementById("reg-email").value;
      const phone = document.getElementById("reg-phone").value;
      const pass = document.getElementById("reg-pass").value;
      const track = document.getElementById("reg-track").value;

      const res = TechNovaAuth.register(name, email, phone, pass, track);
      if (res.success) {
        TechNovaMain.showToast(`Registration successful! Welcome to TechNova, ${res.user.name}.`, "success");
        redirectToTarget();
      } else {
        TechNovaMain.showToast(res.message, "error");
      }
    }

    function redirectToTarget() {
      const params = new URLSearchParams(window.location.search);
      const redirect = params.get("redirect") || "dashboard.html";
      setTimeout(() => {
        window.location.href = redirect;
      }, 500);
    }

    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      if (params.get("tab") === "register") {
        switchTab("register");
      }
    });
  </script>
</body>
</html>
