<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="200" height="200" rx="48" fill="#0f172a" />
  <rect x="10" y="10" width="180" height="180" rx="40" fill="none" stroke="rgba(6, 182, 212, 0.3)" stroke-width="2" />
  <g transform="translate(100, 100)" filter="url(#glow)">
    <!-- Isometric Cube / Quantum Node -->
    <!-- Top Face -->
    <polygon points="0,-48 42,-24 0,0 -42,-24" fill="url(#logoGrad)" opacity="0.95" />
    <!-- Left Face -->
    <polygon points="-42,-24 0,0 0,48 -42,24" fill="#1d4ed8" opacity="0.85" />
    <!-- Right Face -->
    <polygon points="0,0 42,-24 42,24 0,48" fill="#0891b2" opacity="0.9" />
    <!-- Center Core Glow -->
    <circle cx="0" cy="0" r="10" fill="#ffffff" />
    <!-- Orbit Rings -->
    <ellipse cx="0" cy="0" rx="58" ry="24" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8 6" transform="rotate(-25)" />
    <circle cx="52" cy="-14" r="4" fill="#06b6d4" />
  </g>
</svg>
