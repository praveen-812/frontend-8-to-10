<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#aiBg)" rx="24" />
  <circle cx="500" cy="120" r="150" fill="rgba(168, 85, 247, 0.12)" />
  <circle cx="120" cy="220" r="100" fill="rgba(236, 72, 153, 0.1)" />

  <g transform="translate(60, 50)">
    <rect width="480" height="240" rx="16" fill="#0b0d19" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1.5" />
    <rect width="480" height="36" rx="16" fill="#18182e" />
    <circle cx="24" cy="18" r="5" fill="#ef4444" />
    <circle cx="40" cy="18" r="5" fill="#f59e0b" />
    <circle cx="56" cy="18" r="5" fill="#10b981" />
    <text x="80" y="22" fill="#c084fc" font-family="monospace" font-size="12">rag_pipeline.py - LLM &amp; Embeddings Engine</text>

    <!-- AI Neural Nodes & Pipeline -->
    <g transform="translate(30, 60)">
      <circle cx="40" cy="50" r="16" fill="#4f46e5" />
      <text x="40" y="54" fill="#ffffff" font-size="10" text-anchor="middle" font-weight="bold">RAG</text>
      
      <line x1="60" y1="50" x2="130" y2="50" stroke="#a855f7" stroke-width="2" stroke-dasharray="4 2" />
      <circle cx="150" cy="50" r="20" fill="#a855f7" />
      <text x="150" y="54" fill="#ffffff" font-size="10" text-anchor="middle" font-weight="bold">VectorDB</text>
      
      <line x1="175" y1="50" x2="245" y2="50" stroke="#ec4899" stroke-width="2" stroke-dasharray="4 2" />
      <circle cx="270" cy="50" r="24" fill="#ec4899" />
      <text x="270" y="54" fill="#ffffff" font-size="11" text-anchor="middle" font-weight="bold">GPT-4o</text>
      
      <line x1="300" y1="50" x2="360" y2="50" stroke="#06b6d4" stroke-width="2" />
      <circle cx="380" cy="50" r="18" fill="#06b6d4" />
      <text x="380" y="54" fill="#ffffff" font-size="10" text-anchor="middle" font-weight="bold">Output</text>
    </g>

    <text x="30" y="175" fill="#94a3b8" font-family="monospace" font-size="13">Similarity Score: 0.9842 (Cosine Distance)</text>
    <text x="30" y="205" fill="#38bdf8" font-family="monospace" font-size="13">Streaming Speed: 78 tokens/sec • Zero-Shot Presets</text>
