<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task3</title>
    <style>
#card{
    width: 250px;
    height: 320px;
    padding: 30px;
    margin: 5px; 
    background-color: aqua;
    text-align: center;
}
img{
    width: 200px;
    height: 200px;
}
#card{
    transition: 1s ease-in-out;
    opacity: 0;

}
#card.show{
    opacity: 1;
}
    </style>
</head>
<body>


    <div id="card">
    <img src="../../../courseImage/Capture.PNG" alt="">
    <h2 id="title">my card</h2>
    <p class="content">
        this is additional information for this card
    </p>
    </div>
     <button id="btn">show details</button>
    <script>
        const card= document.getElementById("card")
        const btn = document.getElementById ("btn")
        btn.addEventListener( "click",()=>{
              card.classList.toggle("show")
        })

    </script>
</body>
</html>
