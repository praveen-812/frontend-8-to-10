<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day17 task1</title>
</head>

<body>
    <form id="myForm">
        <input type="text" placeholder="enter your name" id="userName">
        <input type="email" placeholder="enter your email" id="userEmail">
        <input type="text" placeholder="enter your password" id="userPassword">
        <button id="submit">submit</button>
        <p>you have already account go to <a href="login.html">login</a></p>
    </form>
    <script>
        const submit = document.getElementById("submit")
        submit.addEventListener("click", (e) => {
            e.preventDefault()



            const name = document.getElementById("userName").value
            const email = document.getElementById("userEmail").value
            const password = document.getElementById("userPassword").value
            if (name == "" && email == "" && password == "") {
                alert("plz enter the value")
                return
            }
            const savedData = JSON.parse(localStorage.getItem("register")) || []

            console.log(savedData)
            const users = {name, email, password}
            savedData.push(users)
            localStorage.setItem("register", JSON.stringify(savedData))
            alert("successful")
            myForm.reset()

            window.location.href = "login.html";

        })
    </script>

</body>

</html>
