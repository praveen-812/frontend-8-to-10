<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="media showcage webpage">
    <meta name="keywords" content="video,Image,youtube, pdf,audio">
    <meta name="author" content="praveen">
    <meta name="robots" content="index,follow">
    <!--open meta tags-->
    <meta property="og:title" content="media website">
    <meta property="og:description" content="media showcage webpage">
    <meta property="og:keywords" content="video,image,youtube,audio">
    <meta property="og:image" content="assests/nature.jpg">
    <meta property="og:type" content="website">
    <title>media showcage</title>
</head>
<center>

    <body>
        <header>
            <h1>Media Showcage </h1>
        </header>
        <main>
            <section>
                <h2>Images</h2>
                <div>

                    <img src="assests/nature.jpg" alt="nature pic" width="200" height="150">nature
                    <img src="assests/sea.jpg" alt="sea" width="200" height="150">Sea
                    <img src="assests/sunrise.jpg" alt="sunrise" width="200" height="150">sunrise
                    <img src="assests/tiger.jpg" alt="tiger" width="200" height="150">tiger
                    <img src="assests/tree.jpg" alt="tree" width="200" height="150">tree

                </div>
            </section>
            <section>
                <h2>audio player</h2>
                <div>
                    <audio controls loop>
                        <source src="assests/audio/audio1.mp3" type="audio/mp3">
                    </audio>

                </div>
            </section>
            <section>
                <h2>video</h2>
                <div>

                    <video controls loop autoplay muted poster="assests/tiger.jpg" width="550" height="300">
                        <source src="assests/video/sample-5s-720p.mp4" type="video/mp4">
                    </video>
                </div>
            </section>
            <section>
                <h2>youtube video</h2>
                <div>
                    <iframe width="560" height="315"
                        src="https://www.youtube-nocookie.com/embed/z5_klHXYZS4?si=qKJnwXjGnoEohN96"
                        title="YouTube video player" frameborder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

                </div>
            </section>
            <section>
                <h2>google maps</h2>
                <div>
                    <iframe
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3886.9373578659965!2d80.19407987412143!3d13.039659313384407!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3a5267006b7d0a9d%3A0xd1def153e3e7dd39!2sK%20K%20Nagar%20Ayyappan%20Temple!5e0!3m2!1sen!2sin!4v1784814263809!5m2!1sen!2sin"
                        width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                        referrerpolicy="strict-origin-when-cross-origin"></iframe>

                </div>
            </section>
            <section>
                <h2>embedded pdf</h2>
                <div>
                    <embed src="assests/pdf/photo.pdf" type="application/PDF" height="300" width="400">
                </div>
            </section>

        </main>
        <footer>
            Thank you for visit this page
        </footer>

    </body>
</center>

</html>
