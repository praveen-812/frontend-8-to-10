<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table</title>
</head>

<body>
    <center>
        <section>
            <h3>Hospital Patient Registration</h3>
            <div>
                <table>
                    <tbody>
                        <tr>
                            <td><label for="user id">Patient ID</label></td>
                            <td><input type="text" placeholder="enter your ID" required id="user id"></td>
                        </tr>
                        <tr>
                            <td><label for="user name">Patient Name</label></td>
                            <td><input type="text" id="user name" placeholder="enter your name" required></td>
                        </tr>
                        <tr>
                            <td><label for="age">Age</label></td>
                            <td><input type="number" placeholder="enter your age" id="age" required></td>
                        </tr>
                        <tr>
                            <td>
                                <label for="gender">Gender</label>
                            </td>
                            <td><input type="radio">Male
                                <input type="radio">Female
                            </td>
                        </tr>
                        <tr>
                            <td><label for="blood group">Blood group</label></td>
                            <td>
                                <input type="checkbox">A+
                                <input type="checkbox">O+
                                <input type="checkbox">B+
                                <input type="checkbox">AB+
                                <input type="checkbox">A-
                                <input type="checkbox">O-
                                <input type="checkbox">B-
                                <input type="checkbox">AB-

                            </td>
                        </tr>
                        <tr>

                            <td><label for="doctor">Doctor</label></td>
                            <td><input type="text" placeholder="enter doctor name" required id="doctor"> </td>
                        </tr>
                        <tr>
                            <td><label for="date">Appointment Date</label></td>
                            <td><input type="date" placeholder="dd-mm-yyyy" required id="date"></td>
                        </tr>
                        <tr>
                            <td><label for="symptoms">Symptoms</label></td>
                            <td><textarea name="type symptoms" id="symptoms" placeholder="type symptoms"
                                    required></textarea></td>
                        </tr>
                        <tr>
                            <td><label for="upload">Medical Report Upload</label></td>
                            <td><input type="file"></td>
                        </tr>
                        <tr>
                            <td></td>
                            <td><input type="submit"></td>
                        </tr>


                    </tbody>

                </table>

            </div>

        </section>
    </center>
</body>

</html>
