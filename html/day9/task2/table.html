<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        table
    </title>
</head>

<body>
    <center>
        <section>
            <h3>Employee Registration</h3>
            <div>
                <table>


                    <tbody>
                        <tr>
                            <td><label for="user id">
                                    Employee ID:</label></td>
                            <td><input type="text" id="user id" placeholder="enter your id" required></td>

                        </tr>
                        <tr>
                            <td><label for="user name">
                                    Employee Name:</label></td>
                            <td><input type="text" id="user name" placeholder="enter your name" required></td>

                        </tr>
                        <tr>
                            <td><label for="email">Email:</label></td>
                            <td><input type="email" placeholder="enter your email" required id="email"></td>
                        </tr>

                        <tr>
                            <td><label for="mobile number">Mobile number:</label></td>
                            <td><input type="tel" placeholder="enter your number" maxlength="10" minlength="10" required
                                    id="mobile number"></td>
                        </tr>
                        <tr>
                            <td><label for="department">Department</label></td>
                            <td>
                                <select>
                                    <option value="" disabled selected>select one...</option>
                                    <option value="html">html</option>
                                    <option value="css">css</option>
                                    <option value="js">js</option>
                                </select>
                            </td>
                        </tr>

                        <tr>
                            <td><label for="Experience">Experience:</label></td>
                            <td>
                                <input type="checkbox" required>1 to 3
                                <input type="checkbox">4 to 8
                                <input type="checkbox">9 to 15

                                <input type="checkbox">15 above
                            </td>
                        </tr>

                        <tr>
                            <td><label for="salary">Salary</label><td><input type="number" placeholder="enter your salary"> </td>
                        </tr>
                          <tr>
                        <td><label for="skills" >Skills:</label></td>
                        <td>
                            <input type="checkbox" required>foorball
                             <input type="checkbox">hockey
                              <input type="checkbox">html
                               <input type="checkbox">chess
                        </td>
                    </tr>

                        <tr>
                            <td><label for=" resume upload">Resume upload</label></td>
                            <td><input type="file"></td>
                        </tr>
                        <tr>
                            <td></td>
                            <td><input type="submit"> <input type="reset"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </center>

</body>

</html>
