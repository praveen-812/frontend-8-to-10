<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
</head>

<body>
    <center>
        <section>
            <h3>login</h3>
            <div>
                <form>
                    <table>
                        <tbody>
                            <tr>
                                <td><label for="id">Application ID</label></td>
                                <td><input type="text" placeholder="enter your ID" required id="id"></td>

                            </tr>
                            <tr>
                                <td><label for="user name">Student Name</label></td>
                                <td><input type="text" placeholder="enter your name" id="user name" required></td>

                            </tr>
                            <tr>
                                <td><label for="department">Department</label></td>
                                <td>
                                    <select>
                                        <option value="" disabled selected>select one..</option>
                                        <option value="html">html</option>
                                        <option value="css">css</option>
                                        <option value="js">js</option>
                                    </select>

                                </td>
                            </tr>
                            <tr>
                                <td><label for="percentage">Percentage</label></td>
                                <td><input type="text" placeholder="enter your percentage" required id="percentage">
                                </td>
                            </tr>
                            <tr>
                                <td><label for="email">Email</label></td>
                                <td><input type="email" id="email" placeholder="enter your name" required></td>
                            </tr>
                            <tr>
                                <td><label for="admission status">Addmission Status</label></td>
                                <td><input type="text" name="" id="admission status" readonly>please wait.....</td>
                            </tr>
                        </tbody>
                    </table>
                </form>
            </div>
        </section>
    </center>
</body>

</html>
