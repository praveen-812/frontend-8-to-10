<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table</title>
</head>

<body>
    <center>
        <section>
            <h3>College Asmission Form</h3>
            <div>
                <table>
                    <tbody>
                        <tr>
                            <td><label for="user name">Student Name</label></td>
                            <td><input type="text" placeholder="enter your name" id="user name" required></td>

                        </tr>
                        <tr>
                            <td><label for="father name">Father Name</label></td>
                            <td><input type="text" id="father name" required placeholder="enter your father name"></td>
                        </tr>
                        <tr>
                            <td><label for="mother name">Mother Name</label></td>
                            <td><input type="text" placeholder="enter your mother name" id="mother name" required></td>
                        </tr>
                        <tr>
                            <td><label for="email">Email</label></td>
                            <td><input type="email" placeholder="enter your email" id="email" required></td>
                        </tr>
                        <tr>
                            <td><label for="phone">phone</label></td>
                            <td><input type="tel" placeholder="enter your number" id="
                            phone" required maxlength="10" minlength="10"></td>

                        </tr>
                        <tr>
                            <td><label for="dob">DOB</label></td>
                            <td><input type="date" placeholder="dd--mm--yyyy" required id="dob"></td>
                        </tr>
                        <tr>
                            <td><label for="gender">Gender</label></td>
                            <td>
                                <input type="radio">Male
                                <input type="radio">Female
                            </td>
                        </tr>
                        <tr>
                            <td><label for="department">Department</label></td>
                            <td>
                                <select>
                                    <option value="" disabled selected>select one..</option>
                                    <option value="html">html</option>
                                    <option value="css">css</option>
                                    <option value="js">js</option>
                                </select>

                            </td>
                        </tr>
                        <tr>
                            <td><label for="percentage">Percentage</label></td>
                            <td><input type="text" placeholder="enter your percentage" required id="percentage"></td>
                        </tr>
                        <tr>
                            <td><label for="address">Address</label></td>
                            <td><textarea name="address" id="address" required
                                    placeholder="enter your addrress"></textarea></td>
                        </tr>
                        <tr>
                            <td><label for="photo">Upload Size Photo</label></td>
                            <td><input type="file" required></td>
                        </tr>
                        <tr>
                            <td></td>
                            <td><input type="submit">p</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </center>
</body>

</html>
