<!DOCTYPE html>
<html lang="en">
<head>
       <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLA institute</title>
    <link rel="shortcut icon" href="assets/logo.png">
</head>
<body>
    <main>
        <center>
        <h1>Feedback Form</h1>
        <div>
            <form method="post">
                <table>
                    <label for="user name">Your First Name:     </label>
                         <input type="text" id="firstname" placeholder="enter your name" required><br />
                        <label for=" lastname">Your Last name: </label>
                        <input type="text" id="lastname" placeholder="enter your name" required><br />
                        <label for=" email">Your Email Address: </label>
                        <input type="email" id="email" placeholder="enter your mail" required><br />
                        <label for="password">Password: </label>
                        <input type="password" id="password" placeholder="enter password" required><br />
                        <label for="mobile number">Your Phone Number: </label>
                        <input type="tel" id="mobile number" placeholder="enter 10 digit number" required maxlength="10"
                            minlength="10"><br />
                            <label for="contact">Reason For Contact:     </label>
                           <textarea name="reasons" id="" cols="30" rows="10" >Feedback</textarea></br>
                           <button>SEND</button>

                </table>
            </form>
        </div>
    </main>
    </center>
</body>
</html>
