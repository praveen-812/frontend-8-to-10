<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Red Light Gradient -->
    <linearGradient id="sirenRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    
    <!-- Blue Light Gradient -->
    <linearGradient id="sirenBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>

    <!-- Metallic Base Gradient -->
    <linearGradient id="metalBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="30%" stop-color="#475569"/>
      <stop offset="70%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Beacon Glass Dome Highlight -->
    <linearGradient id="glassGloss" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Ambient Siren Glow -->
    <radialGradient id="redGlow" cx="30%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="70%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <filter id="sirenShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Left & Right Emergency Strobe Light Beams -->
  <!-- Red Strobe Rays (Left) -->
  <path d="M 32 36 L 6 22 L 10 32 L 30 42 Z" fill="#ef4444" opacity="0.7"/>
  <path d="M 28 46 L 2 48 L 5 56 L 28 52 Z" fill="#ef4444" opacity="0.85"/>
  <path d="M 32 58 L 8 68 L 14 76 L 35 64 Z" fill="#ef4444" opacity="0.6"/>

  <!-- Blue Strobe Rays (Right) -->
  <path d="M 68 36 L 94 22 L 90 32 L 70 42 Z" fill="#3b82f6" opacity="0.7"/>
  <path d="M 72 46 L 98 48 L 95 56 L 72 52 Z" fill="#3b82f6" opacity="0.85"/>
  <path d="M 68 58 L 92 68 L 86 76 L 65 64 Z" fill="#3b82f6" opacity="0.6"/>

  <!-- Siren Beacon Base Shadow -->
  <ellipse cx="50" cy="84" rx="34" ry="7" fill="#020617" opacity="0.6"/>

  <!-- Siren Metallic Base Mount -->
  <path d="M 22 72 L 78 72 L 82 82 C 82 86, 18 86, 18 82 Z" fill="url(#metalBase)" filter="url(#sirenShadow)" stroke="#334155" stroke-width="1.5"/>
  <!-- Chrome Trim Band -->
  <path d="M 22 72 L 78 72 L 77 75 L 23 75 Z" fill="#cbd5e1"/>

  <!-- Center Siren Dome (Split Red / Blue Emergency Light) -->
  <!-- Left Side: Emergency Red Lens -->
  <path d="M 50 18 C 34 18, 24 32, 24 72 L 50 72 Z" fill="url(#sirenRed)" filter="url(#sirenShadow)"/>
  <!-- Right Side: Emergency Blue Lens -->
  <path d="M 50 18 C 66 18, 76 32, 76 72 L 50 72 Z" fill="url(#sirenBlue)" filter="url(#sirenShadow)"/>

  <!-- Internal Reflector / Flasher Core -->
  <ellipse cx="50" cy="46" rx="8" ry="18" fill="#ffffff" opacity="0.3"/>
  <line x1="50" y1="18" x2="50" y2="72" stroke="#0f172a" stroke-width="2" opacity="0.5"/>

  <!-- Glossy Glass Arc Reflection (Professional Highlight) -->
  <path d="M 50 20 C 38 20, 28 32, 27 68 C 32 40, 42 24, 50 20 Z" fill="url(#glassGloss)"/>
  <ellipse cx="40" cy="30" rx="6" ry="3" transform="rotate(-30, 40, 30)" fill="#ffffff" opacity="0.75"/>

  <!-- Top Crown Cap -->
  <ellipse cx="50" cy="18" rx="10" ry="3.5" fill="url(#metalBase)" stroke="#475569" stroke-width="1"/>
  <ellipse cx="50" cy="17" rx="4" ry="1.5" fill="#e2e8f0"/>

  <!-- Center Active Strobe Pulse Pip -->
  <circle cx="50" cy="48" r="3.5" fill="#ffffff"/>
  <circle cx="50" cy="48" r="6" fill="none" stroke="#fef08a" stroke-width="1.5" opacity="0.8"/>
</svg>
