<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="anprGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="goldHex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Hexagonal Tech Shield Frame -->
  <polygon points="50,4 92,26 92,74 50,96 8,74 8,26" fill="#0f172a" stroke="url(#goldHex)" stroke-width="3"/>
  <polygon points="50,10 86,29 86,71 50,90 14,71 14,29" fill="url(#anprGrad)" opacity="0.25"/>

  <!-- Optical Radar Scanner Waves -->
  <circle cx="50" cy="50" r="28" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="50" cy="50" r="18" fill="none" stroke="#93c5fd" stroke-width="1.2"/>

  <!-- Camera / Eye Center -->
  <circle cx="50" cy="50" r="10" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="50" cy="50" r="4" fill="#60a5fa"/>

  <!-- Corner Targeting Reticles -->
  <path d="M 32 38 L 32 32 L 38 32" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <path d="M 68 38 L 68 32 L 62 32" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <path d="M 32 62 L 32 68 L 38 68" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <path d="M 68 62 L 68 68 L 62 68" fill="none" stroke="#fbbf24" stroke-width="2"/>

  <!-- Micro Tech Labels -->
  <text x="50" y="82" font-family="'JetBrains Mono', monospace" font-size="6" font-weight="900" fill="#fbbf24" text-anchor="middle" letter-spacing="1">ANPR•AI</text>
</svg>
