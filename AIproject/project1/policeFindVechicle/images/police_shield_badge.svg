<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Shield Shadow & Outer Gold Border -->
  <path d="M 100 8 L 185 45 C 185 145, 150 205, 100 232 C 50 205, 15 145, 15 45 Z" 
        fill="url(#goldGrad)" 
        filter="url(#badgeShadow)"/>

  <!-- Inner Dark Shield Body -->
  <path d="M 100 16 L 177 50 C 177 140, 144 196, 100 222 C 56 196, 23 140, 23 50 Z" 
        fill="url(#shieldGrad)" 
        stroke="#f59e0b" 
        stroke-width="2"/>

  <!-- Top Ambient Glow -->
  <path d="M 100 20 L 170 52 C 170 100, 140 130, 100 140 C 60 130, 30 100, 30 52 Z" 
        fill="url(#glowGrad)"/>

  <!-- Concentric Radar Wave Lines (ANPR AI) -->
  <circle cx="100" cy="115" r="55" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.4"/>
  <circle cx="100" cy="115" r="42" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.6"/>
  <circle cx="100" cy="115" r="28" fill="none" stroke="#93c5fd" stroke-width="1" opacity="0.7"/>

  <!-- Law Enforcement 8-Point Star -->
  <g transform="translate(100, 115) scale(0.95)">
    <!-- Star Points Behind -->
    <path d="M 0 -45 L 9 -12 L 42 -18 L 18 6 L 30 38 L 0 20 L -30 38 L -18 6 L -42 -18 L -9 -12 Z" 
          fill="url(#goldGrad)" 
          stroke="#78350f" 
          stroke-width="1.5"/>
    <path d="M 0 -38 L 8 -10 L 35 -15 L 15 5 L 25 32 L 0 17 L -25 32 L -15 5 L -35 -15 L -8 -10 Z" 
          fill="#0f172a" 
          stroke="#f59e0b" 
          stroke-width="1"/>
    
    <!-- Central Vehicle Guard Silhouette -->
    <!-- Car Front Silhouette -->
    <path d="M -14 6 L -10 -4 L 10 -4 L 14 6 L 16 11 L -16 11 Z" fill="#60a5fa"/>
    <path d="M -16 11 L 16 11 L 16 18 C 16 20, -16 20, -16 18 Z" fill="#93c5fd"/>
    <!-- Headlights -->
    <circle cx="-11" cy="14" r="2" fill="#fef08a"/>
    <circle cx="11" cy="14" r="2" fill="#fef08a"/>
    <!-- Center AI Lock / Scan Target -->
    <circle cx="0" cy="5" r="5" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="0" y1="-2" x2="0" y2="12" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="-7" y1="5" x2="7" y2="5" stroke="#fbbf24" stroke-width="1.5"/>
  </g>

  <!-- Top Law Enforcement Star -->
  <g transform="translate(100, 36) scale(0.65)">
    <polygon points="0,-12 3,-3 12,-3 5,3 8,12 0,6 -8,12 -5,3 -12,-3 -3,-3" fill="url(#goldGrad)" stroke="#78350f" stroke-width="1"/>
  </g>

  <!-- Bottom Ribbons & Text -->
  <path d="M 40 185 Q 100 205 160 185 L 165 200 Q 100 220 35 200 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="1"/>
  <text x="100" y="196" font-family="'Inter', system-ui, sans-serif" font-size="9.5" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="1.5">VEHICLEGUARD</text>
  
  <text x="100" y="210" font-family="'Inter', system-ui, sans-serif" font-size="7" font-weight="800" fill="#fef08a" text-anchor="middle" letter-spacing="2">POLICE AI</text>
</svg>
